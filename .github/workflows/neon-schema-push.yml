name: Neon Schema Push

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-push:
    runs-on: ubuntu-latest
    environment: neon-schema-update

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push Prisma schema to Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npx prisma db push
